receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:

exporters:
  debug:
    verbosity: detailed
  print:
    path: stdout
    prefix: "[meu-otelcol] "

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [print]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [print]
