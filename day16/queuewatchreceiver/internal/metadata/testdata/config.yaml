default:
all_set:
  metrics:
    queuewatch.messages.processed:
      enabled: true
      attributes: ["queue.name"]
    queuewatch.queue.depth:
      enabled: true
      attributes: ["queue.name"]
  resource_attributes:
    queuewatch.host:
      enabled: true
reaggregate_set:
  metrics:
    queuewatch.messages.processed:
      enabled: true
      attributes: []
    queuewatch.queue.depth:
      enabled: true
      attributes: []
  resource_attributes:
    queuewatch.host:
      enabled: true
none_set:
  metrics:
    queuewatch.messages.processed:
      enabled: false
      attributes: ["queue.name"]
    queuewatch.queue.depth:
      enabled: false
      attributes: ["queue.name"]
  resource_attributes:
    queuewatch.host:
      enabled: false
filter_set_include:
  resource_attributes:
    queuewatch.host:
      enabled: true
      metrics_include:
        - regexp: ".*"
filter_set_exclude:
  resource_attributes:
    queuewatch.host:
      enabled: true
      metrics_exclude:
        - strict: "queuewatch.host-val"
